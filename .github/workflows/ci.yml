name: ci

# The deterministic-input-layer verification gate, executable form. See
# .scratch/deterministic-input-layer/spec.md ("The verification gate") and
# cloud_run_service/utterance_intake/VERIFICATION.md — the "what a green run does
# NOT mean" statement lives at the top of that document, verbatim.
#
# Ticket 01 shipped the `offline` job. `billed-safety` is REAL as of ticket 12
# (child_safety/ Stage 2) and `billed-personal-data` as of ticket 13
# (personal_data/ Stage 3). Both sit behind a GitHub Environment with required
# reviewers and a WIF_PROVIDER secret (ticket 10). Every check named in the spec's
# pass set corresponds to a step here; a check with no step is a spec bug.
#
# NEITHER BILLED JOB HAS BEEN RUN. Both are implemented, both are tested offline,
# and both block inside their own gate on things a workflow cannot do for itself:
# WIF configured, corpora signed off, model version pinned. No recall number and no
# precision number exists for either detector.

on:
  push:
  pull_request:

jobs:
  offline:
    # Free lane: no credentials, no network at run time, runs in seconds. Always
    # safe to run. Any external model in Intake sits behind an injected
    # dependency, so the suite passes with GOOGLE_APPLICATION_CREDENTIALS unset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install offline test dependencies
        # numpy + networkx are declared runtime deps exercised by the coordinator
        # tests; pytest is installed only so unittest discover can import the
        # legacy cognitive_input_processor spike module (deleted by ticket 11).
        run: python -m pip install --upgrade pip numpy networkx pytest
      - name: Utterance Intake contract + conformance + corpus integrity
        working-directory: cloud_run_service
        run: python -m unittest discover -s utterance_intake/tests -v
      - name: Runtime coordinator, phase trace, and turn-level properties
        working-directory: cloud_run_service
        run: python -m unittest discover -s runtime/tests -v
      - name: Personal-data contract — redaction, fail-closed sinks, no leak
        # Named separately from the full sweep below because the two structural
        # assertions in this suite ARE the contract: `RedactedText` is unconstructable
        # without a landed verdict, and no raw identifier appears in any repr.
        working-directory: cloud_run_service
        run: python -m unittest discover -s personal_data/tests -v
      - name: Full offline suite across every cloud_run_service module
        working-directory: cloud_run_service
        run: python -m unittest discover -s . -p "test_*.py" -v

  billed-safety:
    # Billed lane: authenticates to Vertex AI via Workload Identity Federation and
    # runs per-class recall of the child_safety model against blind corpora.
    # This job is intentionally gated behind a GitHub Environment with required
    # reviewers (see .github/BILLED_EVAL_SETUP.md) — a paid run is a deliberate act
    # with a name attached. Every push/PR queues the job; approval controls when
    # it fires. Do NOT add path-based skip conditions here.
    #
    # Ticket 12 (child_safety/ Stage 2) inserts the eval steps below the auth step.
    # Until that ticket ships this job fails at the stub step with a clear message.
    # Until WIF is configured in the repo this job fails at the guard step.
    name: billed-safety (Vertex AI — requires approval)
    needs: [offline]           # offline must be green before a billed run is worth approving
    runs-on: ubuntu-latest
    environment: billed-eval   # required-reviewers gate; see Settings → Environments
    permissions:
      contents: read
      id-token: write          # OIDC token for Workload Identity Federation
    steps:
      - name: Guard — fail loudly if WIF is not configured
        # This check exists so the job fails with a clear human-readable error rather
        # than reaching the auth step with an empty secret and emitting a cryptic
        # message. It is the ONLY unconfigured guard; do not add a second one.
        # See .github/BILLED_EVAL_SETUP.md for GCP + GitHub setup steps.
        shell: bash
        run: |
          missing=""
          if [ -z "$WIF_PROVIDER" ]; then
            missing="${missing}WIF_PROVIDER "
          fi
          if [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            missing="${missing}WIF_SERVICE_ACCOUNT"
          fi
          if [ -n "$missing" ]; then
            echo "::error::billed-safety: secret(s) not configured: ${missing}"
            echo "::error::See .github/BILLED_EVAL_SETUP.md for GCP + GitHub setup steps."
            echo "::error::This is an expected failure until the repo owner completes WIF setup."
            exit 1
          fi
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install eval dependencies
        run: python -m pip install --upgrade pip numpy networkx google-genai python-dotenv

      - name: Cost notice — one Vertex call per uncached eval row
        # A reviewer approving the billed-eval gate gets the row count BEFORE any
        # spend. `--collect` is resumable and caches per prompt hash, so an
        # interrupted run never re-bills and a re-run of an unchanged prompt is free.
        working-directory: cloud_run_service
        shell: bash
        run: |
          echo "======================================================================"
          echo "  billed-safety cost notice"
          echo "======================================================================"
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from eval import safety_eval
          rows = safety_eval._all_rows()
          cached = safety_eval.load_cache()
          pending = [r for r in rows if r["id"] not in cached]
          print(f"  prompt hash : {safety_eval.prompt_hash()}")
          print(f"  corpus rows : {len(rows)}")
          print(f"  cached      : {len(cached)} (free)")
          print(f"  TO BE BILLED: {len(pending)} Vertex calls")
          EOF
          echo "======================================================================"

      - name: Degraded-net freeze + eval harness discipline (offline)
        # Runs before the billed half on purpose: if the frozen outage net has
        # drifted or the harness would publish an aggregate number, there is no
        # point paying for a collection.
        working-directory: cloud_run_service
        run: python -m unittest eval.tests.test_safety_eval -v

      - name: Collect model verdicts against the blind corpora (BILLED, resumable)
        working-directory: cloud_run_service
        env:
          VERTEX_SAFETY_MODEL: ${{ vars.VERTEX_SAFETY_MODEL || 'gemini-2.5-flash' }}
          VERTEX_SAFETY_LOCATION: ${{ vars.VERTEX_SAFETY_LOCATION || 'asia-south1' }}
          VERTEX_SAFETY_MODEL_VERSION: ${{ vars.VERTEX_SAFETY_MODEL_VERSION }}
        run: python -m eval.safety_eval --collect

      - name: Score per-class recall (offline, from the cache)
        # Three numbers per class — model, incremental, union — published
        # separately and never fused. A report that prints one aggregate number is
        # a bug: that is exactly what hid PEER_AT_RISK and UNSAFE_CONTACT at zero
        # behind a shipped "SAFETY recall 1.0".
        working-directory: cloud_run_service
        run: |
          python -m eval.safety_eval --score --report eval/records/safety_eval_report.md
          cat eval/records/safety_eval_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the eval cache and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-eval-records
          path: |
            cloud_run_service/eval/records/safety_eval_cache/
            cloud_run_service/eval/records/safety_eval_report.md

      - name: Cutover gate (stop-ship)
        # Non-blocking until the corpora are signed off and the model version is
        # pinned — both are deliberate hard blocks inside the gate, and both are
        # human acts this job cannot perform for itself. It reports; it does not
        # pretend the gate passed.
        continue-on-error: true
        working-directory: cloud_run_service
        run: python -m eval.safety_eval --cutover

  billed-personal-data:
    # Billed lane: authenticates to Vertex AI via Workload Identity Federation and
    # runs per-class recall + precision of the personal_data model against
    # blind corpora (including the ≥500-row maths-dense corpus).
    # Gating: same billed-eval environment as billed-safety; both require approval.
    # No path-based skip conditions.
    #
    name: billed-personal-data (Vertex AI — requires approval)
    needs: [offline]           # offline must be green before a billed run is worth approving
    runs-on: ubuntu-latest
    environment: billed-eval   # required-reviewers gate; see Settings → Environments
    permissions:
      contents: read
      id-token: write          # OIDC token for Workload Identity Federation
    steps:
      - name: Guard — fail loudly if WIF is not configured
        shell: bash
        run: |
          missing=""
          if [ -z "$WIF_PROVIDER" ]; then
            missing="${missing}WIF_PROVIDER "
          fi
          if [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            missing="${missing}WIF_SERVICE_ACCOUNT"
          fi
          if [ -n "$missing" ]; then
            echo "::error::billed-personal-data: secret(s) not configured: ${missing}"
            echo "::error::See .github/BILLED_EVAL_SETUP.md for GCP + GitHub setup steps."
            echo "::error::This is an expected failure until the repo owner completes WIF setup."
            exit 1
          fi
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install eval dependencies
        run: python -m pip install --upgrade pip numpy networkx google-genai python-dotenv

      - name: Cost notice — one Vertex call per uncached eval row
        # A reviewer approving the billed-eval gate gets the row count BEFORE any
        # spend. `--collect` is resumable and caches per prompt hash, so an
        # interrupted run never re-bills and a re-run of an unchanged prompt is free.
        # Note the shape of the bill here: the maths-dense precision corpus is ~half
        # the rows, and it is not optional — §12 makes the precision gate hard because
        # over-redaction is the failure that breaks the product.
        working-directory: cloud_run_service
        shell: bash
        run: |
          echo "======================================================================"
          echo "  billed-personal-data cost notice"
          echo "======================================================================"
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from eval import personal_data_eval as pde
          rows = pde._all_rows()
          cached = pde.load_cache()
          pending = [r for r in rows if r["id"] not in cached]
          disclosure = [r for r in pending if r["gold_class"]]
          maths = [r for r in pending if not r["gold_class"]]
          print(f"  prompt hash : {pde.prompt_hash()}")
          print(f"  corpus rows : {len(rows)}")
          print(f"  cached      : {len(cached)} (free)")
          print(f"  TO BE BILLED: {len(pending)} Vertex calls")
          print(f"                {len(disclosure)} per-class disclosure rows")
          print(f"                {len(maths)} maths-dense precision rows")
          EOF
          echo "======================================================================"

      - name: Eval harness discipline + corpus integrity (offline)
        # Runs before the billed half on purpose: if the harness would publish an
        # aggregate number, or a corpus is below its §12 size floor, or the cache would
        # mix prompt hashes, there is no point paying for a collection.
        working-directory: cloud_run_service
        run: python -m unittest eval.tests.test_personal_data_eval -v

      - name: Collect model verdicts against the blind corpora (BILLED, resumable)
        working-directory: cloud_run_service
        env:
          VERTEX_PERSONAL_DATA_MODEL: ${{ vars.VERTEX_PERSONAL_DATA_MODEL || 'gemini-2.5-flash' }}
          VERTEX_PERSONAL_DATA_LOCATION: ${{ vars.VERTEX_PERSONAL_DATA_LOCATION || 'asia-south1' }}
          VERTEX_PERSONAL_DATA_MODEL_VERSION: ${{ vars.VERTEX_PERSONAL_DATA_MODEL_VERSION }}
        run: python -m eval.personal_data_eval --collect

      - name: Score per-class recall and maths-dense precision (offline, from the cache)
        # Per-class only. There is no aggregate in this report by design — a single
        # number is what hid whole safety classes at zero behind a shipped "1.0".
        working-directory: cloud_run_service
        run: |
          python -m eval.personal_data_eval --score --report eval/records/personal_data_eval_report.md
          cat eval/records/personal_data_eval_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the eval cache and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-data-eval-records
          path: |
            cloud_run_service/eval/records/personal_data_eval_cache/
            cloud_run_service/eval/records/personal_data_eval_report.md

      - name: Release gate (stop-ship)
        # Non-blocking until the corpora are signed off and the model version is
        # pinned — both are deliberate hard blocks inside the gate, and both are human
        # acts this job cannot perform for itself. It reports; it does not pretend the
        # gate passed.
        continue-on-error: true
        working-directory: cloud_run_service
        run: python -m eval.personal_data_eval --gate
