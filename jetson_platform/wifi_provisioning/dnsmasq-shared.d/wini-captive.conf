# Wini captive-portal DNS catch-all for the Wini-Robot hotspot.
# Installed to /etc/NetworkManager/dnsmasq-shared.d/ — NetworkManager loads it
# into the dnsmasq instance it runs for the "shared" hotspot connection. It
# resolves EVERY name to the hotspot gateway (10.42.0.1) so a phone/laptop that
# joins Wini-Robot gets bounced to the provisioning portal automatically
# ("Sign in to network" popup). Only affects clients of the hotspot, which have
# no upstream internet anyway; it has no effect when Wini is a Wi-Fi client.
address=/#/10.42.0.1
